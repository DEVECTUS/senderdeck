name: Hosted social maintenance

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: senderdeck-social-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    if: github.repository == 'DEVECTUS/senderdeck' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run authenticated hosted maintenance
        env:
          SOCIAL_MAINTENANCE_TOKEN: ${{ secrets.SOCIAL_MAINTENANCE_TOKEN }}
        run: node scripts/run-social-maintenance.mjs
